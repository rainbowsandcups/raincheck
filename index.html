    <button class="nav-float nav-float-next" id="nav-float-next" type="button" aria-label="Next month">›</button>

    <script>
      // ─────────────────────────────────────────────────────────────────────
      // CONFIG
      // ─────────────────────────────────────────────────────────────────────
      // Default: Open-Meteo (free, no API key required).
      // If you'd rather use OpenWeatherMap, set USE_OPENWEATHER = true
      // and paste your key into OPENWEATHER_API_KEY below.
      const USE_OPENWEATHER = false;
      const OPENWEATHER_API_KEY = "YOUR_OPENWEATHER_API_KEY_HERE";

      // Available locations. The first one is the default.
      const LOCATIONS = [
        { id: "oerlikon", label: "Zürich Oerlikon", lat: 47.4115, lon: 8.5439 },
        {
          id: "altstetten",
          label: "Zürich Altstetten",
          lat: 47.3917,
          lon: 8.4886,
        },
        { id: "eggenwil", label: "Eggenwil (AG)", lat: 47.3696, lon: 8.3428 },
        {
          id: "schwieberdingen",
          label: "Schwieberdingen (DE)",
          lat: 48.8761,
          lon: 9.0775,
        },
        {
          id: "magic-lake",
          label: "Camping Magic Lake",
          lat: 46.1321,
          lon: 9.2886,
        },
      ];

      const LOCATION_STORAGE_KEY = "raincheck-location";
      let selectedLocationId =
        localStorage.getItem(LOCATION_STORAGE_KEY) || LOCATIONS[0].id;
      if (!LOCATIONS.find((l) => l.id === selectedLocationId)) {
        selectedLocationId = LOCATIONS[0].id;
      }
      function currentLocation() {
        return (
          LOCATIONS.find((l) => l.id === selectedLocationId) ?? LOCATIONS[0]
        );
      }

      const TEMP_THRESHOLD_C = 16;
      const TEMP_RAIN_OK_C = 22; // > this, rain in the 8–19 window is fine
      const RAIN_MM_PER_HOUR_THRESHOLD = 0.5; // > this in any hour 8–18 counts as "actual rain"
      const DAYTIME_START_HOUR = 8; // inclusive
      const DAYTIME_END_HOUR = 19; // exclusive — so hours 8..18 are checked
      const REFRESH_MS = 10 * 60 * 1000; // 10 minutes

      // ─────────────────────────────────────────────────────────────────────
      // Weather code → label + emoji
      // (Open-Meteo WMO codes: https://open-meteo.com/en/docs)
      // ─────────────────────────────────────────────────────────────────────
      const ICON_BASE = "https://cdn.jsdelivr.net/npm/@bybas/weather-icons@2.0.0/production/fill/all/";

      const WMO = {
        0:  ["Clear",                "clear-day"],
        1:  ["Mostly clear",         "partly-cloudy-day"],
        2:  ["Partly cloudy",        "partly-cloudy-day"],
        3:  ["Cloudy",               "overcast"],
        45: ["Fog",                  "fog"],
        48: ["Freezing fog",         "fog"],
        51: ["Light drizzle",        "drizzle"],
        53: ["Drizzle",              "drizzle"],
        55: ["Heavy drizzle",        "drizzle"],
        56: ["Freezing drizzle",     "sleet"],
        57: ["Freezing drizzle",     "sleet"],
        61: ["Light rain",           "rain"],
        63: ["Rain",                 "rain"],
        65: ["Heavy rain",           "rain"],
        66: ["Freezing rain",        "sleet"],
        67: ["Freezing rain",        "sleet"],
        71: ["Light snow",           "snow"],
        73: ["Snow",                 "snow"],
        75: ["Heavy snow",           "snow"],
        77: ["Snow grains",          "snow"],
        80: ["Rain showers",         "rain"],
        81: ["Rain showers",         "rain"],
        82: ["Heavy showers",        "thunderstorms-rain"],
        85: ["Snow showers",         "snow"],
        86: ["Heavy snow showers",   "snow"],
        95: ["Thunderstorm",         "thunderstorms"],
        96: ["Thunderstorm w/ hail", "thunderstorms-rain"],
        99: ["Thunderstorm w/ hail", "thunderstorms-rain"],
      };

      // ─────────────────────────────────────────────────────────────────────
      // Verdict helpers — shared by top card AND month grid
      // ─────────────────────────────────────────────────────────────────────
      function parseHourlyTime(s) {
        // Open-Meteo with timezone=auto returns strings like
        // "2026-05-12T09:00" already in the location's local time.
        // Parse the parts directly so the browser's timezone doesn't shift them.
        const [date, time] = s.split("T");
        const [y, m, d] = date.split("-").map(Number);
        const [h] = time.split(":").map(Number);
        return { year: y, month0: m - 1, day: d, hour: h };
      }

      function maxDaytimeRainForDay(hourly, year, month0, day) {
        if (!hourly || !hourly.time || !hourly.rain) return 0;
        let max = 0;
        for (let i = 0; i < hourly.time.length; i++) {
          const t = parseHourlyTime(hourly.time[i]);
          if (t.year !== year || t.month0 !== month0 || t.day !== day) continue;
          if (t.hour < DAYTIME_START_HOUR || t.hour >= DAYTIME_END_HOUR)
            continue;
          const r = hourly.rain[i] ?? 0;
          if (r > max) max = r;
        }
        return max;
      }

      function dayVerdict(tmax, maxDaytimeRainMm) {
        if (tmax == null) return null;
        if (tmax < TEMP_THRESHOLD_C) return false;
        const rainy = (maxDaytimeRainMm ?? 0) >= RAIN_MM_PER_HOUR_THRESHOLD;
        if (!rainy) return true;
        // Rain in the daytime window — only OK if it's warm enough that
        // getting a bit wet doesn't matter.
        return tmax > TEMP_RAIN_OK_C;
      }

      // ─────────────────────────────────────────────────────────────────────
      // Fetchers
      // ─────────────────────────────────────────────────────────────────────
      async function fetchOpenMeteo() {
        const loc = currentLocation();
        const url =
          `https://api.open-meteo.com/v1/forecast` +
          `?latitude=${loc.lat}&longitude=${loc.lon}` +
          `&current=temperature_2m,weather_code` +
          `&hourly=rain` +
          `&daily=temperature_2m_max` +
          `&timezone=auto` +
          `&forecast_days=1`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`Open-Meteo HTTP ${res.status}`);
        const data = await res.json();
        const c = data.current;
        const code = c.weather_code;
        const [label, emoji] = WMO[code] ?? ["Unknown", "🌡️"];

        const today = new Date();
        const tmaxToday = data.daily?.temperature_2m_max?.[0] ?? null;
        const maxRainToday = maxDaytimeRainForDay(
          data.hourly,
          today.getFullYear(),
          today.getMonth(),
          today.getDate(),
        );

        return {
          tempC: c.temperature_2m,
          label,
          emoji,
          tmaxToday,
          maxRainToday,
          goOut: dayVerdict(tmaxToday, maxRainToday),
        };
      }

      async function fetchOpenWeather() {
        // NOTE: OpenWeatherMap free tier doesn't easily expose hourly rain
        // for a full day. This path uses a simpler "is it raining now"
        // approximation — it does NOT implement the 8–19 rain-window rule.
        if (
          !OPENWEATHER_API_KEY ||
          OPENWEATHER_API_KEY === "YOUR_OPENWEATHER_API_KEY_HERE"
        ) {
          throw new Error("Missing OpenWeatherMap API key");
        }
        const loc = currentLocation();
        const url =
          `https://api.openweathermap.org/data/2.5/weather` +
          `?lat=${loc.lat}&lon=${loc.lon}&units=metric&appid=${OPENWEATHER_API_KEY}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`OpenWeatherMap HTTP ${res.status}`);
        const data = await res.json();
        const main = data.weather?.[0]?.main ?? "Unknown";
        const desc = data.weather?.[0]?.description ?? main;
        const id = data.weather?.[0]?.id ?? 0;
        // OWM "id" ranges: 5xx = rain, 6xx = snow, 2xx = thunderstorm
        const raining = (id >= 500 && id < 600) || (id >= 200 && id < 300);
        const rainMm =
          (data.rain && (data.rain["1h"] ?? data.rain["3h"] ?? 0)) || 0;
        const tempC = data.main.temp;
        return {
          tempC,
          label: capitalize(desc),
          emoji: pickEmojiFromOWM(main),
          tmaxToday: tempC,
          maxRainToday: raining ? Math.max(rainMm, 0.6) : rainMm,
          goOut: dayVerdict(
            tempC,
            raining ? Math.max(rainMm, 0.6) : rainMm,
          ),
        };
      }

      function pickEmojiFromOWM(main) {
        switch (main) {
          case "Clear":       return "clear-day";
          case "Clouds":      return "overcast";
          case "Rain":        return "rain";
          case "Drizzle":     return "drizzle";
          case "Snow":        return "snow";
          case "Thunderstorm":return "thunderstorms";
          case "Mist":
          case "Fog":
          case "Haze":        return "fog";
          default:            return "partly-cloudy-day";
        }
      }

      function capitalize(s) {
        return s ? s[0].toUpperCase() + s.slice(1) : s;
      }

      // ─────────────────────────────────────────────────────────────────────
      // Render
      // ─────────────────────────────────────────────────────────────────────
      const els = {
        verdict: document.getElementById("verdict"),
        reason: document.getElementById("reason"),
        icon: document.getElementById("icon"),
        temp: document.getElementById("temp"),
        condition: document.getElementById("condition"),
        rain: document.getElementById("rain"),
        updated: document.getElementById("updated"),
        themeColor: document.getElementById("theme-color"),
        favicon: document.getElementById("favicon"),
        refresh: document.getElementById("refresh"),
      };

      function faviconFor(hexColor) {
        const fill = hexColor.replace("#", "%23");
        return (
          "data:image/svg+xml," +
          "%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E" +
          `%3Ccircle cx='32' cy='32' r='28' fill='${fill}'/%3E` +
          "%3C/svg%3E"
        );
      }

      function render(weather) {
        const { tempC, label, emoji, tmaxToday, maxRainToday, goOut } =
          weather;

        document.body.classList.toggle("go", goOut);
        document.body.classList.toggle("stay", !goOut);
        const verdictColor = goOut ? "#10b981" : "#e11d48";
        els.themeColor.setAttribute("content", verdictColor);
        els.favicon.setAttribute("href", faviconFor(verdictColor));

        els.verdict.innerHTML = goOut
          ? '<span class="verdict-dot go"></span> GO OUT'
          : '<span class="verdict-dot stay"></span> STAY HOME';
        els.icon.innerHTML = `<img src="${ICON_BASE}${emoji}.svg" alt="${label}">`;

        els.temp.textContent = `${Math.round(tempC)}°C`;
        els.condition.textContent = label;
        const rainMm = maxRainToday ?? 0;
        els.rain.textContent =
          rainMm === 0
            ? "None"
            : rainMm < RAIN_MM_PER_HOUR_THRESHOLD
              ? `${rainMm.toFixed(1)} mm (drizzle)`
              : `${rainMm.toFixed(1)} mm/h`;

        const reasons = [];
        if (tmaxToday != null && tmaxToday < TEMP_THRESHOLD_C) {
          reasons.push(`max only ${Math.round(tmaxToday)}°C today`);
        } else if (
          (maxRainToday ?? 0) >= RAIN_MM_PER_HOUR_THRESHOLD &&
          tmaxToday != null &&
          tmaxToday <= TEMP_RAIN_OK_C
        ) {
          reasons.push("rain expected between 8 and 19");
        }
        els.reason.textContent = goOut
          ? tmaxToday != null
            ? `Today: up to ${Math.round(
                tmaxToday,
              )}°C, no real rain between 8 and 19.`
            : "Warm and dry — enjoy it."
          : `Better stay in — ${reasons.join(" and ")}.`;

        const now = new Date();
        els.updated.textContent = `Updated ${now.toLocaleTimeString("de-CH", {
          hour: "2-digit",
          minute: "2-digit",
        })} · source: ${USE_OPENWEATHER ? "OpenWeatherMap" : "Open-Meteo"}`;
      }

      function renderError(err) {
        document.body.classList.remove("go", "stay");
        els.verdict.textContent = "Hmm.";
        els.reason.innerHTML = `<div class="error">Couldn't load weather: ${
          err.message || err
        }</div>`;
        els.icon.innerHTML = `<img src="${ICON_BASE}not-available.svg" alt="Error">`;
        els.temp.textContent = "–";
        els.condition.textContent = "–";
        els.rain.textContent = "–";
      }

      async function update() {
        try {
          const data = USE_OPENWEATHER
            ? await fetchOpenWeather()
            : await fetchOpenMeteo();
          render(data);
        } catch (err) {
          console.error(err);
          renderError(err);
        }
      }

      // ─────────────────────────────────────────────────────────────────────
      // Month overview
      // ─────────────────────────────────────────────────────────────────────
      function pad2(n) {
        return String(n).padStart(2, "0");
      }

      function daysInMonth(year, month0) {
        return new Date(year, month0 + 1, 0).getDate();
      }

      // ISO weekday with Monday=0..Sunday=6
      function isoWeekday(date) {
        return (date.getDay() + 6) % 7;
      }

      // 10-second per-fetch timeout so a hung connection can't stall the
      // whole month's Promise.all forever.
      async function fetchWithTimeout(url, ms = 10000) {
        const ctrl = new AbortController();
        const id = setTimeout(() => ctrl.abort(), ms);
        try {
          return await fetch(url, { signal: ctrl.signal });
        } finally {
          clearTimeout(id);
        }
      }

      async function fetchForecastRange(pastDays, forecastDays) {
        const loc = currentLocation();
        const url =
          `https://api.open-meteo.com/v1/forecast` +
          `?latitude=${loc.lat}&longitude=${loc.lon}` +
          `&daily=temperature_2m_max` +
          `&hourly=rain` +
          `&timezone=auto` +
          `&past_days=${pastDays}` +
          `&forecast_days=${forecastDays}`;
        const res = await fetchWithTimeout(url);
        if (!res.ok) throw new Error(`Forecast range HTTP ${res.status}`);
        return res.json();
      }

      async function fetchArchiveYear(year, month0, fromDay, toDay) {
        const loc = currentLocation();
        const start = `${year}-${pad2(month0 + 1)}-${pad2(fromDay)}`;
        const end = `${year}-${pad2(month0 + 1)}-${pad2(toDay)}`;
        const url =
          `https://archive-api.open-meteo.com/v1/archive` +
          `?latitude=${loc.lat}&longitude=${loc.lon}` +
          `&start_date=${start}&end_date=${end}` +
          `&daily=temperature_2m_max` +
          `&hourly=rain` +
          `&timezone=auto`;
        const res = await fetchWithTimeout(url);
        if (!res.ok) throw new Error(`Archive HTTP ${res.status}`);
        return res.json();
      }

      async function populateClimate(days, year, month0, fromDay, toDay) {
        const yearsBack = 5;
        const years = [];
        for (let y = year - yearsBack; y < year; y++) years.push(y);

        // Fetch sequentially. Browsers cap concurrent connections per host
        // (~6 in Chrome/Safari). With 3 carousel slots each kicking off 5
        // climate fetches in parallel that's 15 in flight — some get queued
        // for so long that our per-fetch watchdog aborts them. Going serial
        // here means at most one archive request per month is in flight at
        // a time. Still ~600 ms for all 5 years, well below the 20 s slot
        // watchdog.
        const archives = [];
        let failures = 0;
        for (const y of years) {
          try {
            const data = await fetchArchiveYear(y, month0, fromDay, toDay);
            archives.push(data);
          } catch (err) {
            failures++;
            console.warn(`[climate] ${y}-${pad2(month0 + 1)} failed:`, err);
          }
        }
        if (archives.length === 0) {
          for (let d = fromDay; d <= toDay; d++) {
            if (!days[d])
              days[d] = { day: d, source: "climate", goOut: null };
          }
          console.warn(
            `[climate] all ${years.length} archive fetches failed for ${year}-${pad2(month0 + 1)}`,
          );
          return;
        }
        if (failures > 0) {
          console.log(
            `[climate] ${archives.length}/${years.length} archives succeeded for ${year}-${pad2(month0 + 1)}`,
          );
        }

        try {

          for (let d = fromDay; d <= toDay; d++) {
            let go = 0;
            let total = 0;
            let tmaxSum = 0;
            let tmaxCount = 0;
            let rainCount = 0;
            for (const arch of archives) {
              const t = arch.daily.time;
              let tmax = null;
              let archYear = null;
              for (let i = 0; i < t.length; i++) {
                const [yy, mm, dd] = t[i].split("-").map(Number);
                if (dd !== d) continue;
                tmax = arch.daily.temperature_2m_max[i];
                archYear = yy;
                break;
              }
              if (tmax == null || archYear == null) continue;
              tmaxSum += tmax;
              tmaxCount++;
              const maxRain = maxDaytimeRainForDay(
                arch.hourly,
                archYear,
                month0,
                d,
              );
              if (maxRain >= RAIN_MM_PER_HOUR_THRESHOLD) rainCount++;
              const v = dayVerdict(tmax, maxRain);
              if (v == null) continue;
              total++;
              if (v) go++;
            }
            const probability = total > 0 ? go / total : null;
            const avgTmax = tmaxCount > 0 ? tmaxSum / tmaxCount : null;
            const rainProbability = tmaxCount > 0 ? rainCount / tmaxCount : null;
            days[d] = {
              day: d,
              tmax: avgTmax,
              probability,
              rainProbability,
              goOut: avgTmax != null ? dayVerdict(avgTmax, (rainProbability ?? 0) >= 0.5 ? RAIN_MM_PER_HOUR_THRESHOLD : 0) : null,
              source: "climate",
              yearsTotal: total,
            };
          }
        } catch (err) {
          console.warn("Climatology failed:", err);
          for (let d = fromDay; d <= toDay; d++) {
            if (!days[d])
              days[d] = { day: d, source: "climate", goOut: null };
          }
        }
      }

      async function buildMonthData(targetYear, targetMonth0) {
        const today = new Date();
        const todayY = today.getFullYear();
        const todayM0 = today.getMonth();
        const todayD = today.getDate();
        const totalDays = daysInMonth(targetYear, targetMonth0);
        const days = {};

        const targetKey = targetYear * 12 + targetMonth0;
        const todayKey = todayY * 12 + todayM0;
        const isCurrentMonth = targetKey === todayKey;
        const isPastMonth = targetKey < todayKey;

        if (isCurrentMonth) {
          // Past days from the archive endpoint (forecast's past_days
          // returns nulls for days older than ~20). Today + 16 days from
          // forecast. Both in parallel.
          const forecastDays = 16;
          const fetches = [];
          if (todayD > 1) {
            fetches.push(
              fetchArchiveYear(targetYear, targetMonth0, 1, todayD - 1)
                .then((data) => ({ kind: "archive", data }))
                .catch((err) => {
                  console.warn("Archive (current month past) failed:", err);
                  return null;
                }),
            );
          }
          fetches.push(
            fetchForecastRange(0, forecastDays).then((data) => ({
              kind: "forecast",
              data,
            })),
          );
          const results = await Promise.all(fetches);

          for (const r of results) {
            if (!r) continue;
            const { kind, data } = r;
            for (let i = 0; i < data.daily.time.length; i++) {
              const [yy, mm, dd] = data.daily.time[i].split("-").map(Number);
              if (yy !== targetYear || mm - 1 !== targetMonth0) continue;
              const tmax = data.daily.temperature_2m_max[i];
              if (tmax == null) continue;
              const maxRain = maxDaytimeRainForDay(
                data.hourly,
                targetYear,
                targetMonth0,
                dd,
              );
              days[dd] = {
                day: dd,
                tmax,
                maxRain,
                goOut: dayVerdict(tmax, maxRain),
                source:
                  kind === "archive"
                    ? "history"
                    : dd < todayD
                      ? "history"
                      : "forecast",
              };
            }
          }

          const lastCoveredDay = todayD + forecastDays - 1;
          if (lastCoveredDay + 1 <= totalDays) {
            await populateClimate(
              days,
              targetYear,
              targetMonth0,
              lastCoveredDay + 1,
              totalDays,
            );
          }
        } else if (isPastMonth) {
          // Entire month from archive
          try {
            const arch = await fetchArchiveYear(
              targetYear,
              targetMonth0,
              1,
              totalDays,
            );
            for (let i = 0; i < arch.daily.time.length; i++) {
              const [yy, mm, dd] = arch.daily.time[i].split("-").map(Number);
              if (yy !== targetYear || mm - 1 !== targetMonth0) continue;
              const tmax = arch.daily.temperature_2m_max[i];
              const maxRain = maxDaytimeRainForDay(
                arch.hourly,
                targetYear,
                targetMonth0,
                dd,
              );
              days[dd] = {
                day: dd,
                tmax,
                maxRain,
                goOut: dayVerdict(tmax, maxRain),
                source: "history",
              };
            }
          } catch (err) {
            console.warn("Archive failed:", err);
          }
        } else {
          // Future month: forecast for days within today..today+15, climate for rest
          const todayMidnight = new Date(todayY, todayM0, todayD);
          let fcFirst = null;
          let fcLast = null;
          let climFirst = null;
          let climLast = null;
          for (let d = 1; d <= totalDays; d++) {
            const dt = new Date(targetYear, targetMonth0, d);
            const diff = Math.round(
              (dt - todayMidnight) / 86400000,
            );
            if (diff >= 0 && diff <= 15) {
              if (fcFirst === null) fcFirst = d;
              fcLast = d;
            } else {
              if (climFirst === null) climFirst = d;
              climLast = d;
            }
          }

          if (fcFirst !== null) {
            const fc = await fetchForecastRange(0, 16);
            for (let i = 0; i < fc.daily.time.length; i++) {
              const [yy, mm, dd] = fc.daily.time[i].split("-").map(Number);
              if (yy !== targetYear || mm - 1 !== targetMonth0) continue;
              const tmax = fc.daily.temperature_2m_max[i];
              const maxRain = maxDaytimeRainForDay(
                fc.hourly,
                targetYear,
                targetMonth0,
                dd,
              );
              days[dd] = {
                day: dd,
                tmax,
                maxRain,
                goOut: dayVerdict(tmax, maxRain),
                source: "forecast",
              };
            }
          }
          if (climFirst !== null) {
            await populateClimate(
              days,
              targetYear,
              targetMonth0,
              climFirst,
              climLast,
            );
          }
        }

        const todayDay = isCurrentMonth ? todayD : null;
        return {
          year: targetYear,
          month0: targetMonth0,
          totalDays,
          todayDay,
          days,
        };
      }

      const MONTH_NAMES = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December",
      ];
      const WEEKDAY_SHORT = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

      const WEEKDAY_4 = ["Mon", "Tue", "Wed", "Thu"];

      function renderMonth(monthData, titleEl, gridEl) {
        const { year, month0, totalDays, todayDay, days } = monthData;
        titleEl.textContent = `${MONTH_NAMES[month0]} ${year}`;
        gridEl.innerHTML = "";

        const headers = fourDayMode ? WEEKDAY_4 : WEEKDAY_SHORT;
        gridEl.style.gridTemplateColumns = fourDayMode ? "repeat(4,1fr)" : "repeat(7,1fr)";
        for (const w of headers) {
          const h = document.createElement("div");
          h.className = "weekday";
          h.textContent = w;
          gridEl.appendChild(h);
        }

        const firstWd = isoWeekday(new Date(year, month0, 1));
        // In 4-day mode: offset = Mon(0)/Tue(1)/Wed(2)/Thu(3), Fri-Sun → 0 (skip those days entirely)
        const offset = fourDayMode ? (firstWd < 4 ? firstWd : 0) : firstWd;
        for (let i = 0; i < offset; i++) {
          const c = document.createElement("div");
          c.className = "cell empty";
          gridEl.appendChild(c);
        }

        for (let d = 1; d <= totalDays; d++) {
          // In 4-day mode, skip Fri (4), Sat (5), Sun (6)
          if (fourDayMode && isoWeekday(new Date(year, month0, d)) >= 4) continue;
          const data = days[d];
          const cell = document.createElement("div");
          cell.className = "cell";
          if (data?.goOut === true) cell.classList.add("go");
          else if (data?.goOut === false) cell.classList.add("stay");
          if (data?.source === "climate") cell.classList.add("climate");
          if (data?.source !== "climate" && (data?.maxRain ?? 0) >= RAIN_MM_PER_HOUR_THRESHOLD) {
            cell.classList.add("rainy");
            // 2 px at threshold (0.5 mm/h), up to 8 px at ~3.5 mm/h+
            const sw = Math.max(2, Math.min(8, Math.round(2 + (data.maxRain - RAIN_MM_PER_HOUR_THRESHOLD) * 2)));
            cell.style.setProperty("--stripe-w", sw + "px");
          }
          if (data?.source === "climate" && (data?.rainProbability ?? 0) >= 0.5) {
            cell.classList.add("rainy");
            // 2 px at 50 % probability, up to 7 px at 100 %
            const sw = Math.max(2, Math.min(7, Math.round(2 + (data.rainProbability - 0.5) * 10)));
            cell.style.setProperty("--stripe-w", sw + "px");
          }
          if (d === todayDay) cell.classList.add("today");

          const num = document.createElement("div");
          num.className = "day-num";
          num.textContent = String(d);
          cell.appendChild(num);

          if (data?.tmax != null) {
            const meta = document.createElement("div");
            meta.className = "day-meta";
            meta.textContent = `${Math.round(data.tmax)}°`;
            cell.appendChild(meta);
          }

          if (data) {
            if (data.source === "climate") {
              cell.title =
                data.probability != null
                  ? `${d}. ${MONTH_NAMES[month0]}: ~${Math.round(
                      data.probability * 100,
                    )}% Go-Out probability (climate estimate from ${
                      data.yearsTotal
                    } past years)`
                  : `${d}. ${MONTH_NAMES[month0]}: climate data unavailable`;
            } else {
              cell.title = `${d}. ${MONTH_NAMES[month0]}: ${Math.round(
                data.tmax,
              )}°C max, peak ${(data.maxRain ?? 0).toFixed(
                1,
              )} mm/h rain in 8–19 window (${
                data.source === "history" ? "measured" : "forecast"
              })`;
            }
          }

          gridEl.appendChild(cell);
        }
      }

      function renderMonthPlaceholder(year, month0, titleEl, gridEl) {
        titleEl.textContent = `${MONTH_NAMES[month0]} ${year}`;
        gridEl.innerHTML = "";
        const headers = fourDayMode ? WEEKDAY_4 : WEEKDAY_SHORT;
        gridEl.style.gridTemplateColumns = fourDayMode ? "repeat(4,1fr)" : "repeat(7,1fr)";
        for (const w of headers) {
          const h = document.createElement("div");
          h.className = "weekday";
          h.textContent = w;
          gridEl.appendChild(h);
        }
        const firstWd = isoWeekday(new Date(year, month0, 1));
        const offset = fourDayMode ? (firstWd < 4 ? firstWd : 0) : firstWd;
        for (let i = 0; i < offset; i++) {
          const c = document.createElement("div");
          c.className = "cell empty";
          gridEl.appendChild(c);
        }
        const total = daysInMonth(year, month0);
        for (let d = 1; d <= total; d++) {
          if (fourDayMode && isoWeekday(new Date(year, month0, d)) >= 4) continue;
          const cell = document.createElement("div");
          cell.className = "cell loading";
          const num = document.createElement("div");
          num.className = "day-num";
          num.textContent = String(d);
          cell.appendChild(num);
          gridEl.appendChild(cell);
        }
      }

      // ─────────────────────────────────────────────────────────────────────
      // Carousel — 3 physical slots (prev | curr | next), swipeable
      // ─────────────────────────────────────────────────────────────────────
      const ANIM_MS = 360;

      const slides      = [0, 1, 2].map((i) => document.getElementById(`slide-${i}`));
      const slideTitles = [0, 1, 2].map((i) => document.getElementById(`slide-title-${i}`));
      const slideGrids  = [0, 1, 2].map((i) => document.getElementById(`slide-grid-${i}`));

      // Center month (currently displayed)
      const _now = new Date();
      let carouselYear   = _now.getFullYear();
      let carouselMonth0 = _now.getMonth();
      // Keep viewedYear/viewedMonth0 aliases for the auto-refresh interval below
      let viewedYear   = carouselYear;
      let viewedMonth0 = carouselMonth0;

      // slotCol[i] = column of slides[i]: -1 (left), 0 (center), +1 (right)
      let slotCol = [-1, 0, 1];
      let isAnimating = false;

      // Per-slot fetch tokens — discard results from superseded requests
      const slotTokens = [0, 0, 0];

      // 4-day work-week toggle (Mon–Thu only). Default ON.
      let fourDayMode = localStorage.getItem('raincheck-4day') !== 'false';
      // Cached month data per slot so we can re-render without re-fetching
      const slotData = [null, null, null];
      // Cache by year-month key so re-navigating to a month skips the fetch.
      // The current month is excluded from cache reads (always re-fetched on
      // explicit refresh) but past/future months are stable for the session.
      const monthCache = new Map();

      function setSlidePos(i, col, animated) {
        if (!animated) {
          slides[i].classList.add("no-transition");
          slides[i].getBoundingClientRect(); // force reflow so transition is suppressed
        } else {
          slides[i].classList.remove("no-transition");
        }
        slides[i].style.setProperty("--col", col);
        slides[i].classList.toggle("active", col === 0);
      }

      function offsetMonthBy(year, month0, delta) {
        let m = month0 + delta, y = year;
        while (m < 0)  { m += 12; y--; }
        while (m > 11) { m -= 12; y++; }
        return { year: y, month0: m };
      }

      async function loadSlide(slotIdx, year, month0) {
        const token = ++slotTokens[slotIdx];
        const tag = `slot${slotIdx} ${year}-${pad2(month0 + 1)}`;
        const cacheKey = `${year}-${month0}`;
        const now = new Date();
        const isCurrent =
          year === now.getFullYear() && month0 === now.getMonth();

        // Use cached month data when available (except for the current month,
        // which we always want fresh so today's forecast stays accurate).
        if (!isCurrent && monthCache.has(cacheKey)) {
          const cached = monthCache.get(cacheKey);
          slotData[slotIdx] = cached;
          renderMonth(cached, slideTitles[slotIdx], slideGrids[slotIdx]);
          console.log(`[carousel] ${tag} from cache`);
          return;
        }

        slotData[slotIdx] = null; // clear stale cache while loading
        renderMonthPlaceholder(year, month0, slideTitles[slotIdx], slideGrids[slotIdx]);
        console.log(`[carousel] ${tag} loading (token ${token})`);

        // Watchdog: if buildMonthData hangs longer than this, surface the
        // problem instead of leaving the user staring at a loading skeleton.
        const WATCHDOG_MS = 20000;
        let watchdogId;
        const watchdog = new Promise((_, reject) => {
          watchdogId = setTimeout(
            () =>
              reject(
                new Error(`timeout after ${WATCHDOG_MS / 1000}s loading data`),
              ),
            WATCHDOG_MS,
          );
        });

        try {
          const data = await Promise.race([
            buildMonthData(year, month0),
            watchdog,
          ]);
          clearTimeout(watchdogId);
          if (slotTokens[slotIdx] !== token) {
            console.log(`[carousel] ${tag} stale, discarding`);
            return;
          }
          slotData[slotIdx] = data;
          monthCache.set(cacheKey, data);
          renderMonth(data, slideTitles[slotIdx], slideGrids[slotIdx]);
          console.log(`[carousel] ${tag} rendered`);
        } catch (err) {
          clearTimeout(watchdogId);
          if (slotTokens[slotIdx] !== token) return;
          console.error(`[carousel] ${tag} failed:`, err);
          slideGrids[slotIdx].innerHTML =
            `<div style="grid-column:1/-1;text-align:center;color:#0f172a;font-size:14px;padding:24px;background:rgba(255,255,255,0.6);border-radius:12px;margin:8px;">⚠️ Couldn't load: ${err.message}<br><button type="button" id="retry-slot-${slotIdx}" style="margin-top:12px;appearance:none;background:rgba(255,255,255,0.8);border:1px solid rgba(15,23,42,0.2);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;font-weight:600;color:#0f172a;cursor:pointer;">Retry</button></div>`;
          const retry = document.getElementById(`retry-slot-${slotIdx}`);
          if (retry) {
            retry.addEventListener("click", () =>
              loadSlide(slotIdx, year, month0),
            );
          }
        }
      }

      function updateToggleLabels() {
        // When in 4-day mode the button offers to expand → "7d"
        // When in 7-day mode the button offers to collapse → "4d"
        const label = fourDayMode ? "7d" : "4d";
        document.querySelectorAll(".days-toggle").forEach((btn) => {
          btn.textContent = label;
          // Highlight button when we're showing the full 7-day view
          btn.classList.toggle("on", !fourDayMode);
        });
      }

      function toggleDayMode() {
        fourDayMode = !fourDayMode;
        localStorage.setItem('raincheck-4day', fourDayMode ? 'true' : 'false');
        updateToggleLabels();
        // Re-render all slots from cache (instant — no network call)
        for (let i = 0; i < 3; i++) {
          if (slotData[i]) {
            renderMonth(slotData[i], slideTitles[i], slideGrids[i]);
          } else {
            // Data still loading — placeholder will re-render correctly when it arrives
            const { year, month0 } = offsetMonthBy(carouselYear, carouselMonth0, slotCol[i]);
            renderMonthPlaceholder(year, month0, slideTitles[i], slideGrids[i]);
          }
        }
      }

      // Wire up all .days-toggle buttons (all 3 slides share the same action)
      document.querySelectorAll(".days-toggle").forEach((btn) => {
        btn.addEventListener("click", toggleDayMode);
      });

      function initCarousel() {
        for (let i = 0; i < 3; i++) {
          setSlidePos(i, slotCol[i], false);
          const { year, month0 } = offsetMonthBy(carouselYear, carouselMonth0, slotCol[i]);
          loadSlide(i, year, month0);
        }
      }

      function navigateCarousel(dir) { // -1 = prev month, +1 = next month
        if (isAnimating) return;
        isAnimating = true;

        // Advance the logical center
        const next = offsetMonthBy(carouselYear, carouselMonth0, dir);
        carouselYear   = next.year;
        carouselMonth0 = next.month0;
        viewedYear   = carouselYear;
        viewedMonth0 = carouselMonth0;

        // Slide all panels left (dir=+1) or right (dir=-1) with animation
        for (let i = 0; i < 3; i++) {
          slotCol[i] -= dir;
          setSlidePos(i, slotCol[i], true);
        }

        setTimeout(() => {
          // Recycle the panel that slid off-screen (±2) to the opposite edge
          for (let i = 0; i < 3; i++) {
            if (Math.abs(slotCol[i]) === 2) {
              const newCol = -(slotCol[i] / 2); // -2 → +1, +2 → -1
              slotCol[i] = newCol;
              setSlidePos(i, newCol, false);
              const { year, month0 } = offsetMonthBy(carouselYear, carouselMonth0, newCol);
              loadSlide(i, year, month0);
              break;
            }
          }
          isAnimating = false;
        }, ANIM_MS);
      }

      // Touch swipe on the carousel
      const carouselEl = document.getElementById("month-carousel");
      let touchStartX = null, touchStartY = null;
      carouselEl.addEventListener("touchstart", (e) => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }, { passive: true });
      carouselEl.addEventListener("touchend", (e) => {
        if (touchStartX === null) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        touchStartX = null;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
          navigateCarousel(dx < 0 ? 1 : -1);
        }
      }, { passive: true });

      // In-card prev/next arrows (all slides)
      document.querySelectorAll(".month-nav[data-dir]").forEach((btn) => {
        btn.addEventListener("click", () => navigateCarousel(parseInt(btn.dataset.dir)));
      });

      // Floating desktop arrows
      document.getElementById("nav-float-prev").addEventListener("click", () => navigateCarousel(-1));
      document.getElementById("nav-float-next").addEventListener("click", () => navigateCarousel(1));

      // Reload all 3 visible slots (e.g. on location change or manual refresh).
      // Clears the month cache so the new fetches go all the way to the
      // network — otherwise we'd just keep showing data for the previous
      // location after a swap.
      function refreshCarousel() {
        monthCache.clear();
        for (let i = 0; i < 3; i++) {
          const { year, month0 } = offsetMonthBy(carouselYear, carouselMonth0, slotCol[i]);
          loadSlide(i, year, month0);
        }
      }

      // Populate the location dropdown
      const locationSelect = document.getElementById("location");
      for (const loc of LOCATIONS) {
        const opt = document.createElement("option");
        opt.value = loc.id;
        opt.textContent = loc.label;
        locationSelect.appendChild(opt);
      }
      locationSelect.value = selectedLocationId;
      function syncDocumentTitle() {
        document.title = `Raincheck — ${currentLocation().label}`;
      }
      syncDocumentTitle();
      locationSelect.addEventListener("change", () => {
        selectedLocationId = locationSelect.value;
        localStorage.setItem(LOCATION_STORAGE_KEY, selectedLocationId);
        syncDocumentTitle();
        update();
        refreshCarousel();
      });


      els.refresh.addEventListener("click", () => {
        update();
        refreshCarousel();
      });
      update();
      updateToggleLabels();
      initCarousel();
      setInterval(() => {
        update();
        // Only auto-refresh when the center month is the current month —
        // historical/climate data for other months doesn't change.
        const now = new Date();
        if (
          carouselYear === now.getFullYear() &&
          carouselMonth0 === now.getMonth()
        ) {
          refreshCarousel();
        }
      }, REFRESH_MS);

      // ─────────────────────────────────────────────────────────────────────
      // Tab navigation
      // ─────────────────────────────────────────────────────────────────────
      const TAB_STORAGE_KEY = "raincheck-tab";
      const TABS = ["raincheck", "sauna", "ferien"];
      let activeTab = localStorage.getItem(TAB_STORAGE_KEY) || "raincheck";
      if (!TABS.includes(activeTab)) activeTab = "raincheck";

      let saunaRendered = false;
      let ferienRendered = false;

      function applyTab(name) {
        if (!TABS.includes(name)) return;
        activeTab = name;
        localStorage.setItem(TAB_STORAGE_KEY, name);
        for (const btn of document.querySelectorAll("#tabs button")) {
          btn.classList.toggle("active", btn.dataset.tab === name);
        }
        for (const pane of document.querySelectorAll(".tab-pane")) {
          pane.classList.toggle("hidden", pane.id !== `tab-${name}`);
        }
        // Raincheck has floating month-nav arrows — hide them on other tabs
        for (const b of document.querySelectorAll(".nav-float")) {
          b.style.display = name === "raincheck" ? "" : "none";
        }
        // Ferien & Sauna get the Instagram-style gradient background
        document.body.classList.toggle("ferien-bg", name === "ferien");
        document.body.classList.toggle("sauna-bg", name === "sauna");
        if (name === "sauna" && !saunaRendered) {
          renderSauna();
          saunaRendered = true;
        }
        if (name === "ferien") {
          if (!ferienRendered) {
            renderFerien();
            ferienRendered = true;
          }
          // Pull latest from server every time the tab opens
          refreshFerienFromAPI();
        }
      }

      document.getElementById("tabs").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-tab]");
        if (!btn) return;
        applyTab(btn.dataset.tab);
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      // Defer until after the rest of the script runs so all FERIEN_* and
      // SAUNA_* `const` declarations below have left the temporal dead zone.
      // Without this, restoring "ferien" or "sauna" as the active tab from
      // localStorage on first paint would synchronously try to render
      // before those constants are initialized → ReferenceError.
      queueMicrotask(() => applyTab(activeTab));

      // ─────────────────────────────────────────────────────────────────────
      // Sauna pane
      // ─────────────────────────────────────────────────────────────────────
      const SAUNA_LOCATIONS = [
        // Fitnesspark — immer Frauen, heiss rotiert
        { name: "Glattpark",   brand: "Fitnesspark", lat: 47.4267, lng: 8.5640, url: "https://www.fitnesspark.ch/fitnessparks/zuerich-glattpark/saunalandschaft-exklusiv-fuer-frauen/",   hot: [1,0,0,1,0,1,0], women: [1,1,1,1,1,1,1] },
        { name: "Stadelhofen", brand: "Fitnesspark", lat: 47.3668, lng: 8.5475, url: "https://www.fitnesspark.ch/fitnessparks/zuerich-stadelhofen/saunalandschaft-exklusiv-fuer-frauen/", hot: [0,1,1,0,1,0,1], women: [1,1,1,1,1,1,1] },
        { name: "Puls 5",      brand: "Fitnesspark", lat: 47.3893, lng: 8.5175, url: "https://www.fitnesspark.ch/fitnessparks/puls-5-zuerich/saunalandschaft-exklusiv-fuer-frauen/",      hot: [1,0,0,1,0,1,0], women: [1,1,1,1,1,1,1] },
        // Activ Fitness — Frauentag
        { name: "Altstetten",  brand: "Active Fitness", lat: 47.3905, lng: 8.4885, url: "https://www.activfitness.ch/studios/activ-fitness-zuerich-altstetten/",  hot: [1,1,1,1,1,1,1], women: [0,1,0,0,0,0,0] },
        { name: "Kreuzplatz",  brand: "Active Fitness", lat: 47.3642, lng: 8.5527, url: "https://www.activfitness.ch/studios/activ-fitness-zuerich-kreuzplatz/",  hot: [1,1,1,1,1,1,1], women: [0,1,0,0,0,0,0] },
        { name: "Stauffacher", brand: "Active Fitness", lat: 47.3739, lng: 8.5288, url: "https://www.activfitness.ch/studios/activ-fitness-zuerich-stauffacher/", hot: [1,1,1,1,1,1,1], women: [1,1,1,1,1,1,1] },
        { name: "Oerlikon",    brand: "Active Fitness", lat: 47.4108, lng: 8.5470, url: "https://www.activfitness.ch/studios/activ-fitness-zuerich-oerlikon/",    hot: [1,1,1,1,1,1,1], women: [0,0,0,1,0,0,0] },
        { name: "Wiedikon",    brand: "Active Fitness", lat: 47.3690, lng: 8.5145, url: "https://www.activfitness.ch/studios/activ-fitness-zuerich-wiedikon/",    hot: [1,1,1,1,1,1,1], women: [0,0,0,1,0,0,0] },
        // Activ Fitness — getrennte Kabinen
        { name: "Central",       brand: "Active Fitness", lat: 47.3768, lng: 8.5430, url: "https://www.activfitness.ch/studios/activ-fitness-zuerich-central/",       hot: [1,1,1,1,1,1,1], women: [1,1,1,1,1,1,1] },
        { name: "Forum",         brand: "Active Fitness", lat: 47.3770, lng: 8.5340, url: "https://www.activfitness.ch/studios/activ-fitness-zuerich-forum/",         hot: [1,1,1,1,1,1,1], women: [1,1,1,1,1,1,1] },
        { name: "Langstrasse",   brand: "Active Fitness", lat: 47.3782, lng: 8.5305, url: "https://www.activfitness.ch/studios/activ-fitness-zuerich-langstrasse/",   hot: [1,1,1,1,1,1,1], women: [1,1,1,1,1,1,1] },
        { name: "Tiefenbrunnen", brand: "Active Fitness", lat: 47.3545, lng: 8.5565, url: "https://www.activfitness.ch/studios/activ-fitness-zuerich-tiefenbrunnen/", hot: [1,1,1,1,1,1,1], women: [1,1,1,1,1,1,1] },
        { name: "Wipkingen",     brand: "Active Fitness", lat: 47.3950, lng: 8.5260, url: "https://www.activfitness.ch/studios/activ-fitness-zuerich-wipkingen/",     hot: [1,1,1,1,1,1,1], women: [1,1,1,1,1,1,1] },
      ];
      const SAUNA_BRANDS = ["Fitnesspark", "Active Fitness"];
      const SAUNA_DAY_NAMES = [
        "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag",
      ];

      let saunaPos = null;          // { lat, lng } sobald GPS verfügbar
      let saunaGeoAutoTried = false; // Auto-Versuch nur einmal beim ersten Render

      // Distanz Luftlinie in km (Haversine)
      function saunaDistKm(a, b) {
        const R = 6371, toRad = (d) => (d * Math.PI) / 180;
        const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
        const s =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
        return R * 2 * Math.asin(Math.sqrt(s));
      }

      // Standort anfordern. fromUser=true (Button-Tap) ist der zuverlässige Weg,
      // da Privacy-Browser wie Brave die automatische Abfrage oft still blocken.
      function requestSaunaLocation(fromUser) {
        const btn = document.getElementById("sauna-geo-btn");
        const setBtn = (text, cls, disabled) => {
          if (!btn) return;
          btn.textContent = text;
          btn.className = "sauna-geo-btn" + (cls ? " " + cls : "");
          btn.disabled = !!disabled;
        };
        if (!navigator.geolocation) {
          setBtn("Standort wird nicht unterstützt", "error", true);
          return;
        }
        setBtn("📍 Standort wird ermittelt …", "", true);
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            saunaPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            setBtn("📍 Nach Distanz zu dir sortiert", "located", true);
            renderSauna();
          },
          (err) => {
            const denied = err && err.code === 1; // PERMISSION_DENIED
            // Bei stillem Auto-Fehlschlag den Button neutral lassen (zum Antippen)
            if (!fromUser && !denied) {
              setBtn("📍 In meiner Nähe sortieren", "", false);
              return;
            }
            setBtn(
              denied
                ? "📍 Standort blockiert – tippen & erlauben"
                : "📍 Standort nicht verfügbar – erneut versuchen",
              "error",
              false,
            );
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 300000 },
        );
      }

      function renderSauna() {
        // Beim ersten Render automatisch versuchen (Browser, die es erlauben)
        if (!saunaGeoAutoTried) {
          saunaGeoAutoTried = true;
          requestSaunaLocation(false);
        }

        const container = document.getElementById("sauna-content");
        container.innerHTML = "";
        const todayIso = (new Date().getDay() + 6) % 7; // Mo=0..So=6
        for (let offset = 0; offset < 7; offset++) {
          const iso = (todayIso + offset) % 7;
          const isToday = offset === 0;
          const open = SAUNA_LOCATIONS.filter((l) => l.hot[iso] && l.women[iso]);
          if (open.length === 0) continue;
          const block = document.createElement("div");
          block.className = "day-block" + (isToday ? " today" : "");
          const label = document.createElement("div");
          label.className = "day-label";
          label.textContent = isToday
            ? `Heute · ${SAUNA_DAY_NAMES[iso]}`
            : SAUNA_DAY_NAMES[iso];
          block.appendChild(label);

          for (const brand of SAUNA_BRANDS) {
            const studios = open.filter((l) => l.brand === brand);
            if (studios.length === 0) continue;
            if (saunaPos) {
              for (const l of studios) l._dist = saunaDistKm(saunaPos, l);
              studios.sort((a, b) => a._dist - b._dist);
            }

            const group = document.createElement("div");
            group.className = "brand-group";
            const brandLabel = document.createElement("div");
            brandLabel.className = "brand-label";
            brandLabel.textContent = brand;
            group.appendChild(brandLabel);

            const list = document.createElement("div");
            list.className = "studios";
            for (const loc of studios) {
              const studio = document.createElement("div");
              studio.className = "studio";
              const dot = document.createElement("span");
              dot.className = "studio-dot";
              studio.appendChild(dot);
              const a = document.createElement("a");
              a.href = loc.url;
              a.target = "_blank";
              a.rel = "noopener";
              a.textContent = loc.name;
              studio.appendChild(a);
              if (saunaPos) {
                const dist = document.createElement("span");
                dist.className = "studio-dist";
                dist.textContent = `${loc._dist.toFixed(1)} km`;
                studio.appendChild(dist);
              }
              list.appendChild(studio);
            }
            group.appendChild(list);
            block.appendChild(group);
          }
          container.appendChild(block);
        }
      }

      document
        .getElementById("sauna-geo-btn")
        .addEventListener("click", () => requestSaunaLocation(true));

      // ─────────────────────────────────────────────────────────────────────
      // Ferien pane — full-year vacation picker, max 25 weekday selections
      // ─────────────────────────────────────────────────────────────────────
      const FERIEN_STORAGE_PREFIX = "raincheck-ferien-";
      const FERIEN_MAX = 25;
      const FERIEN_MONTH_NAMES = [
        "Januar", "Februar", "März", "April", "Mai", "Juni",
        "Juli", "August", "September", "Oktober", "November", "Dezember",
      ];
      const FERIEN_WEEKDAY_SHORT = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];

      let ferienYear = new Date().getFullYear();
      let ferienSelections = loadFerien(ferienYear);

      // ─── Storage: localStorage as fast cache, API as cross-device source ──
      function loadFerienLocal(year) {
        const key = FERIEN_STORAGE_PREFIX + year;
        try {
          const raw = localStorage.getItem(key);
          const arr = raw ? JSON.parse(raw) : [];
          return new Set(Array.isArray(arr) ? arr : []);
        } catch {
          return new Set();
        }
      }

      // Sync alias used by the rest of the code at init time
      function loadFerien(year) {
        const set = loadFerienLocal(year);
        console.log(`[ferien] loaded ${set.size} day(s) from cache for ${year}`);
        return set;
      }

      function writeFerienLocal(year, selections) {
        const key = FERIEN_STORAGE_PREFIX + year;
        try {
          localStorage.setItem(key, JSON.stringify([...selections]));
          return true;
        } catch {
          return false;
        }
      }

      // Compare two Sets for equal contents
      function setsEqual(a, b) {
        if (a.size !== b.size) return false;
        for (const v of a) if (!b.has(v)) return false;
        return true;
      }

      // Async fetch from server. Returns Set or null on failure.
      async function fetchFerienFromAPI(year) {
        try {
          const r = await fetch(`/api/ferien?year=${year}`);
          if (!r.ok) {
            console.warn(`[ferien] API GET → ${r.status}`);
            return null;
          }
          const { days } = await r.json();
          return new Set(Array.isArray(days) ? days : []);
        } catch (err) {
          console.warn("[ferien] API GET failed:", err);
          return null;
        }
      }

      // Refresh in-memory + UI from server. Safe to call any time.
      async function refreshFerienFromAPI() {
        const yearAtStart = ferienYear;
        const fromAPI = await fetchFerienFromAPI(yearAtStart);
        if (fromAPI === null) return;
        // If user switched years while we waited, ignore stale response
        if (yearAtStart !== ferienYear) return;

        // First-sync case: server is empty but this device has local data
        // (e.g. user selected days before the API existed). Push local up.
        if (fromAPI.size === 0 && ferienSelections.size > 0) {
          console.log(
            `[ferien] server empty, pushing local ${ferienSelections.size} day(s) for ${yearAtStart}`,
          );
          await saveFerien(yearAtStart, ferienSelections);
          return;
        }

        if (setsEqual(fromAPI, ferienSelections)) {
          console.log(
            `[ferien] API in sync (${fromAPI.size} day(s) for ${yearAtStart})`,
          );
          return;
        }
        console.log(
          `[ferien] API differs (local ${ferienSelections.size} → server ${fromAPI.size}), updating`,
        );
        ferienSelections = fromAPI;
        writeFerienLocal(yearAtStart, fromAPI);
        if (activeTab === "ferien" && ferienRendered) {
          renderFerien();
        }
      }

      // Persist: write to cache immediately, then sync to API.
      async function saveFerien(year, selections) {
        const arr = [...selections];
        const localOk = writeFerienLocal(year, selections);
        if (!localOk) {
          console.warn(`[ferien] localStorage cache write failed for ${year}`);
        }
        try {
          const r = await fetch(`/api/ferien?year=${year}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ days: arr }),
          });
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          console.log(
            `[ferien] synced ${arr.length} day(s) to API for ${year}`,
          );
          showFerienToast(`✓ ${arr.length}/${FERIEN_MAX} synct`, "ok");
        } catch (err) {
          console.warn("[ferien] API POST failed:", err);
          showFerienToast(
            "⚠️ Sync offline — nur lokal gespeichert",
            "warn",
          );
        }
      }

      // Brief floating confirmation/warning at the bottom of the screen
      let ferienToastTimer = null;
      function showFerienToast(message, kind) {
        let toast = document.getElementById("ferien-toast");
        if (!toast) {
          toast = document.createElement("div");
          toast.id = "ferien-toast";
          toast.style.cssText = `
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            color: #0f172a;
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 200ms ease;
            z-index: 1000;
          `;
          document.body.appendChild(toast);
        }
        toast.textContent = message;
        toast.style.background =
          kind === "warn"
            ? "rgba(254, 215, 170, 0.95)"
            : "rgba(255, 255, 255, 0.95)";
        toast.style.opacity = "1";
        if (ferienToastTimer) clearTimeout(ferienToastTimer);
        ferienToastTimer = setTimeout(() => {
          toast.style.opacity = "0";
        }, 1400);
      }

      function isoDateLocal(date) {
        return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
      }

      function addDaysLocal(date, n) {
        const r = new Date(date);
        r.setDate(r.getDate() + n);
        return r;
      }

      // Easter Sunday — Anonymous Gregorian algorithm (Meeus/Jones/Butcher)
      function easterSunday(year) {
        const a = year % 19;
        const b = Math.floor(year / 100);
        const c = year % 100;
        const d = Math.floor(b / 4);
        const e = b % 4;
        const f = Math.floor((b + 8) / 25);
        const g = Math.floor((b - f + 1) / 3);
        const h = (19 * a + b - d - g + 15) % 30;
        const i = Math.floor(c / 4);
        const k = c % 4;
        const L = (32 + 2 * e + 2 * i - h - k) % 7;
        const m = Math.floor((a + 11 * h + 22 * L) / 451);
        const month = Math.floor((h + L - 7 * m + 114) / 31);
        const day = ((h + L - 7 * m + 114) % 31) + 1;
        return new Date(year, month - 1, day);
      }

      // Kanton Zürich — gesetzliche Feiertage
      function zhHolidays(year) {
        const e = easterSunday(year);
        return {
          [isoDateLocal(new Date(year, 0, 1))]: "Neujahr",
          [isoDateLocal(new Date(year, 0, 2))]: "Berchtoldstag",
          [isoDateLocal(addDaysLocal(e, -2))]: "Karfreitag",
          [isoDateLocal(addDaysLocal(e, 1))]: "Ostermontag",
          [isoDateLocal(new Date(year, 4, 1))]: "Tag der Arbeit",
          [isoDateLocal(addDaysLocal(e, 39))]: "Auffahrt",
          [isoDateLocal(addDaysLocal(e, 50))]: "Pfingstmontag",
          [isoDateLocal(new Date(year, 7, 1))]: "Bundesfeier",
          [isoDateLocal(new Date(year, 11, 25))]: "Weihnachten",
          [isoDateLocal(new Date(year, 11, 26))]: "Stephanstag",
        };
      }

      function renderFerien() {
        try {
          renderFerienInner();
        } catch (err) {
          const container = document.getElementById("ferien-year");
          if (container) {
            container.innerHTML = `<div style="padding:24px;color:#0f172a;background:rgba(255,255,255,0.7);border-radius:14px;border:1px solid rgba(15,23,42,0.2);font-family:monospace;font-size:12px;white-space:pre-wrap;word-break:break-word;">⚠️ renderFerien crash:\n\n${err.message}\n\n${err.stack || ""}</div>`;
          }
          console.error("[ferien] render crash:", err);
        }
      }

      function renderFerienInner() {
        const container = document.getElementById("ferien-year");
        container.innerHTML = "";
        document.getElementById("ferien-year-label").textContent =
          String(ferienYear);

        const holidays = zhHolidays(ferienYear);
        const today = new Date();
        const todayY = today.getFullYear();
        const todayM = today.getMonth();
        const todayD = today.getDate();
        console.log(
          `[ferien] rendering ${ferienYear}, today=${todayY}-${todayM + 1}-${todayD}`,
        );

        let renderedMonths = 0;

        for (let m = 0; m < 12; m++) {
          // Skip months that are entirely in the past
          if (
            ferienYear < todayY ||
            (ferienYear === todayY && m < todayM)
          ) {
            continue;
          }

          const isCurrentMonth =
            ferienYear === todayY && m === todayM;

          const monthDiv = document.createElement("div");
          monthDiv.className = "ferien-month";

          const title = document.createElement("div");
          title.className = "ferien-month-title";
          title.textContent = `${FERIEN_MONTH_NAMES[m]} ${ferienYear}`;
          monthDiv.appendChild(title);

          const grid = document.createElement("div");
          grid.className = "ferien-grid";

          for (const w of FERIEN_WEEKDAY_SHORT) {
            const h = document.createElement("div");
            h.className = "weekday";
            h.textContent = w;
            grid.appendChild(h);
          }

          const firstWd = isoWeekday(new Date(ferienYear, m, 1));
          for (let i = 0; i < firstWd; i++) {
            const empty = document.createElement("span");
            empty.className = "ferien-cell empty";
            grid.appendChild(empty);
          }

          const total = daysInMonth(ferienYear, m);
          for (let d = 1; d <= total; d++) {
            const date = new Date(ferienYear, m, d);
            const dStr = isoDateLocal(date);
            const wd = isoWeekday(date);
            const isWeekend = wd >= 5;
            const holidayName = holidays[dStr];
            const isHoliday = !!holidayName;
            const isPast = isCurrentMonth && d < todayD;
            const isSelected = ferienSelections.has(dStr);
            const isToday = isCurrentMonth && d === todayD;

            const cell = document.createElement("button");
            cell.type = "button";
            cell.className = "ferien-cell";
            if (isPast) cell.classList.add("past");
            else if (isHoliday) cell.classList.add("holiday");
            else if (isWeekend) cell.classList.add("disabled");
            if (isSelected && !isPast) cell.classList.add("selected");
            if (isToday) cell.classList.add("today");
            cell.textContent = String(d);
            cell.dataset.date = dStr;

            if (isPast) cell.title = "Vergangen";
            else if (isHoliday) cell.title = holidayName;
            else if (isWeekend) cell.title = wd === 5 ? "Samstag" : "Sonntag";

            grid.appendChild(cell);
          }

          monthDiv.appendChild(grid);
          container.appendChild(monthDiv);
          renderedMonths += 1;
        }
        console.log(`[ferien] rendered ${renderedMonths} month(s)`);

        // If nothing rendered (e.g., user navigated to a past year), show hint
        if (renderedMonths === 0) {
          const empty = document.createElement("div");
          empty.className = "ferien-month";
          empty.style.textAlign = "center";
          empty.style.padding = "32px 16px";
          empty.style.color = "var(--muted)";
          empty.innerHTML =
            `Keine planbaren Tage in ${ferienYear}.<br>` +
            `<button type="button" id="ferien-jump-today" style="` +
            `appearance:none;background:rgba(255,255,255,0.5);` +
            `border:1px solid var(--border);border-radius:999px;` +
            `padding:6px 14px;font:inherit;font-size:13px;font-weight:600;` +
            `color:var(--text);cursor:pointer;margin-top:12px;">` +
            `→ Zu ${todayY} springen</button>`;
          container.appendChild(empty);
          document
            .getElementById("ferien-jump-today")
            .addEventListener("click", () => {
              ferienYear = todayY;
              ferienSelections = loadFerien(ferienYear);
              renderFerien();
            });
        }

        updateFerienCounter();
      }

      function updateFerienCounter() {
        document.getElementById("ferien-count").textContent = String(
          ferienSelections.size,
        );
        document
          .getElementById("ferien-counter")
          .classList.toggle("full", ferienSelections.size >= FERIEN_MAX);
      }

      document
        .getElementById("ferien-year")
        .addEventListener("click", (e) => {
          const cell = e.target.closest(".ferien-cell");
          if (
            !cell ||
            cell.classList.contains("empty") ||
            cell.classList.contains("disabled") ||
            cell.classList.contains("holiday") ||
            cell.classList.contains("past")
          ) {
            return;
          }
          const dStr = cell.dataset.date;
          if (!dStr) return;

          if (ferienSelections.has(dStr)) {
            ferienSelections.delete(dStr);
            cell.classList.remove("selected");
          } else {
            if (ferienSelections.size >= FERIEN_MAX) {
              cell.classList.remove("shake");
              void cell.offsetWidth; // restart animation
              cell.classList.add("shake");
              return;
            }
            ferienSelections.add(dStr);
            cell.classList.add("selected");
          }

          saveFerien(ferienYear, ferienSelections);
          updateFerienCounter();
        });

      document
        .getElementById("ferien-year-prev")
        .addEventListener("click", () => {
          ferienYear -= 1;
          ferienSelections = loadFerien(ferienYear);
          renderFerien();
          refreshFerienFromAPI();
        });
      document
        .getElementById("ferien-year-next")
        .addEventListener("click", () => {
          ferienYear += 1;
          ferienSelections = loadFerien(ferienYear);
          renderFerien();
          refreshFerienFromAPI();
        });

      // Refresh from server when the tab/window comes back into focus
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && activeTab === "ferien") {
          refreshFerienFromAPI();
        }
      });

      // Kick off a server sync shortly after init so the first paint
      // (from localStorage) gets corrected if another device added/removed days.
      setTimeout(() => {
        refreshFerienFromAPI();
      }, 300);
    </script>
